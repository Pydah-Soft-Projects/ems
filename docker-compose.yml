# EMS production — Docker only (no PM2 in the deploy path).
# Host Nginx (/etc/nginx/conf.d/ems.conf) proxies:
#   /api/* → 127.0.0.1:4000
#   /*     → 127.0.0.1:3000
#
# On the server once:
#   1. backend/.env     (secrets)
#   2. .env.docker      (public URLs — from .env.docker.example)
#   3. Keep system nginx + ems.conf running
#   4. ./scripts/deploy.sh

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ems_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: ems-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  ems_uploads:
