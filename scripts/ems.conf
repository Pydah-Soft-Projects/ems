# ==============================================================================
# Nginx Configuration for Examination Management System (EMS)
# Place this file on your EC2 instance at: /etc/nginx/conf.d/ems.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Frontend: ems.pydah.edu.in (Next.js on Port 3000)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ems.pydah.edu.in;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Optional fallback for local /api requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Next.js Frontend Application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

# ------------------------------------------------------------------------------
# 2. Backend API: ems-backend.pydah.edu.in (Node.js/Express on Port 4000)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ems-backend.pydah.edu.in;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # All API traffic forwarded directly to Express backend
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large file uploads / student data processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
