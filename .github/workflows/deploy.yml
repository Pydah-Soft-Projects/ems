name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      #################################################
      # Checkout code
      #################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Setup Node.js for frontend build (Node 20 LTS)
      #################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      #################################################
      # Build frontend on GitHub Actions
      #################################################
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://ems-backend.pydah.edu.in/api
          NEXT_PUBLIC_APP_URL: https://ems.pydah.edu.in
        run: |
          npm run build

      #################################################
      # Configure SSH
      #################################################
      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      #################################################
      # Upload frontend build to server
      #################################################
      - name: Upload frontend build
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/.next/ \
            "ec2-user@${{ secrets.SERVER_IP }}:/tmp/ems-frontend-next/"

      #################################################
      # Deploy to server
      #################################################
      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "ec2-user@${SERVER_IP}" << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ec2-user/ems"

          echo "=========================================="
          echo "Starting EMS deployment"
          echo "=========================================="

          cd "${PROJECT_DIR}"

          # Determine active branch (main or master)
          TARGET_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")"
          if [ "${TARGET_BRANCH}" != "main" ] && [ "${TARGET_BRANCH}" != "master" ]; then
            TARGET_BRANCH="main"
          fi

          echo "==> Pulling latest code from ${TARGET_BRANCH}..."
          git fetch origin "${TARGET_BRANCH}"
          git checkout "${TARGET_BRANCH}"
          # Discard any local changes to log files or hashes before pulling
          git checkout -- backend/logs/ 2>/dev/null || true
          git checkout -- frontend/logs/ 2>/dev/null || true
          git checkout -- backend/.npm-ci-lockhash 2>/dev/null || true
          git checkout -- frontend/.npm-ci-lockhash 2>/dev/null || true
          git pull origin "${TARGET_BRANCH}"

          #################################################
          # BACKEND PART
          #################################################
          echo "==> Checking backend dependencies..."
          cd "${PROJECT_DIR}/backend"

          LOCK_HASH_FILE="${PROJECT_DIR}/backend/.npm-ci-lockhash"
          CURRENT_HASH="$(sha256sum package-lock.json package.json 2>/dev/null | sha256sum | awk '{print $1}')"
          PREV_HASH="$(cat "${LOCK_HASH_FILE}" 2>/dev/null || true)"

          if [ ! -d node_modules ] || [ "${CURRENT_HASH}" != "${PREV_HASH}" ]; then
            echo "==> Installing backend dependencies (lockfile changed or node_modules missing)..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            echo "${CURRENT_HASH}" > "${LOCK_HASH_FILE}"
          else
            echo "==> Backend dependencies unchanged, skipping npm ci"
          fi

          #################################################
          # FRONTEND PART
          #################################################
          echo "==> Deploying frontend build artifacts..."
          mkdir -p "${PROJECT_DIR}/frontend/.next"

          if [ -d /tmp/ems-frontend-next ]; then
            rsync -av --delete \
              /tmp/ems-frontend-next/ \
              "${PROJECT_DIR}/frontend/.next/"
            rm -rf /tmp/ems-frontend-next
          fi

          echo "==> Checking frontend dependencies..."
          cd "${PROJECT_DIR}/frontend"

          FRONTEND_LOCK_HASH_FILE="${PROJECT_DIR}/frontend/.npm-ci-lockhash"
          FRONTEND_CURRENT_HASH="$(sha256sum package-lock.json package.json 2>/dev/null | sha256sum | awk '{print $1}')"
          FRONTEND_PREV_HASH="$(cat "${FRONTEND_LOCK_HASH_FILE}" 2>/dev/null || true)"

          if [ ! -d node_modules ] || [ "${FRONTEND_CURRENT_HASH}" != "${FRONTEND_PREV_HASH}" ]; then
            echo "==> Installing frontend dependencies (lockfile changed or node_modules missing)..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            echo "${FRONTEND_CURRENT_HASH}" > "${FRONTEND_LOCK_HASH_FILE}"
          else
            echo "==> Frontend dependencies unchanged, skipping npm ci"
          fi

          #################################################
          # PM2 RELOAD
          #################################################
          echo "==> Reloading PM2 processes..."

          cd "${PROJECT_DIR}/backend"
          mkdir -p logs
          pm2 startOrReload ecosystem.config.cjs --update-env

          cd "${PROJECT_DIR}/frontend"
          mkdir -p logs
          pm2 startOrReload ecosystem.config.cjs --update-env

          echo "==> Saving PM2 process list..."
          pm2 save

          #################################################
          # Cleanup
          #################################################
          rm -rf /tmp/ems-frontend-next

          echo "=========================================="
          echo "EMS deployment completed successfully"
          echo "=========================================="

          ENDSSH

      #################################################
      # Cleanup SSH key
      #################################################
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
