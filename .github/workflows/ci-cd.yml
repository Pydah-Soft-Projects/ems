name: CI / CD (Docker)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Production deploy: SSH → scripts/deploy.sh → docker compose up --build
# Host Nginx ems.conf stays as reverse proxy. No PM2 in this path.

concurrency:
  group: ems-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: npm run build

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost/api
          NEXT_PUBLIC_APP_URL: http://localhost
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          envs: GH_PAT,GH_USERNAME,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            cd ${{ secrets.EC2_APP_PATH }}
            chmod +x scripts/deploy.sh
            export GH_PAT
            export GH_USERNAME
            export DEPLOY_BRANCH
            ./scripts/deploy.sh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
